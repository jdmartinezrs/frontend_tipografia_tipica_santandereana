<div class="flex min-w-0 flex-col gap-1.5">
  @if (label()) {
    <label [for]="id()" class="text-sm font-semibold text-[#2a1a05]">{{ label() }}</label>
  }
  <div class="relative">
    <select
      [id]="id()"
      [formControl]="control()"
      [attr.aria-label]="label() ? null : ariaLabel()"
      [attr.aria-invalid]="showError ? true : null"
      [attr.aria-describedby]="showError ? id() + '-error' : null"
      class="h-12 w-full cursor-pointer appearance-none rounded-[14px] border-2 border-transparent bg-white pl-4 pr-10 text-[15px] text-[#2b2b2b] shadow-md focus:border-[#2b1b3d] focus:outline-none disabled:cursor-not-allowed disabled:opacity-60"
    >
      <option value="" disabled>{{ placeholder() }}</option>
      @for (o of options(); track o.value) {
        <option [value]="o.value">{{ o.label }}</option>
      }
    </select>
    <span class="pointer-events-none absolute right-4 top-1/2 -translate-y-1/2 text-xs text-[#2b2b2b]">▾</span>
  </div>
  @if (showError) {
    <span [id]="id() + '-error'" role="alert" class="text-xs font-medium text-[#7a1f1f]">
      {{ message }}
    </span>
  }
</div>
