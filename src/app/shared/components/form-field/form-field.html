<div class="flex min-w-0 flex-col gap-1.5">
  @if (label()) {
    <label [for]="id()" class="text-sm font-semibold text-[#2a1a05]">{{ label() }}</label>
  }
  <div class="relative">
    <input
      [id]="id()"
      [type]="type() === 'password' && passwordVisible() ? 'text' : type()"
      [formControl]="control()"
      [placeholder]="placeholder()"
      [autocomplete]="autocomplete()"
      [attr.aria-invalid]="showError ? true : null"
      [attr.aria-describedby]="showError ? id() + '-error' : null"
      [class.pr-12]="type() === 'password'"
      class="h-12 w-full rounded-[14px] border-2 border-transparent bg-white px-4 text-[15px] text-[#2b2b2b] shadow-md placeholder:text-[#6b6b6b] focus:border-[#2b1b3d] focus:outline-none"
    />
    @if (type() === 'password') {
      <button type="button" class="absolute inset-y-0 right-3 flex items-center text-[#6b6b6b] hover:text-[#2b1b3d]"
        [attr.aria-label]="passwordVisible() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
        [attr.aria-pressed]="passwordVisible()" (click)="togglePasswordVisibility()">
        @if (passwordVisible()) {
          <svg aria-hidden="true" viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18M10.6 10.6a2 2 0 002.8 2.8M9.9 5.2A10.8 10.8 0 0112 5c5 0 8.5 4.5 9.5 7-.4 1-1.2 2.1-2.3 3.1M6.2 6.2C3.9 7.7 2.8 10 2.5 12c.5 1.3 1.8 3.3 4.2 4.8A9.8 9.8 0 0012 19c1 0 2-.2 2.9-.5" />
          </svg>
        } @else {
          <svg aria-hidden="true" viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.5 12S6 5 12 5s9.5 7 9.5 7-3.5 7-9.5 7-9.5-7-9.5-7z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
        }
      </button>
    }
  </div>
  @if (showError) {
    <span [id]="id() + '-error'" role="alert" class="text-xs font-medium text-[#7a1f1f]">
      {{ message }}
    </span>
  }
</div>
